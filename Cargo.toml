[package]
name = "tcgoblin-api"
version = "0.1.0"
edition = "2024"
default-run = "api"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
base64 = "0.23.1"
chromiumoxide = { version = "0.9.1", features = ["fetcher", "rustls", "zip8"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures-util = "0.3.34"
mongodb = "3.9.1"
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "deflate", "json"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"
